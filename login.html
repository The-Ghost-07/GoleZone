<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - GoalZone</title>
  <meta name="description" content="GoalZone - Sign in">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/premium.css">
</head>
<body data-page="login">
  <div id="site-header"></div>
  <main class="auth-wrap">
    <div class="auth-card">
      <h1>Sign in</h1>
      <form id="loginForm" novalidate>
        <label for="lId">Email or mobile number</label>
        <input id="lId" autocomplete="username">
        <label for="lPass">Password</label>
        <div class="pw"><input id="lPass" type="password" autocomplete="current-password"><button type="button" class="pw-toggle" data-toggle="lPass">Show</button></div>
        <p class="error-text" id="lErr" role="alert"></p>
        <label class="chk"><input type="checkbox" id="lKeep"> Keep me signed in</label>
        <button class="btn btn-block">Sign in</button>
      </form>
      <button class="link-btn" id="forgotBtn">Forgot password?</button>

      <!-- Demo password reset -->
      <div id="resetBox" hidden>
        <h2>Reset password</h2>
        <div id="rStep1"><label for="rId">Your email or mobile number</label><input id="rId"><button type="button" class="btn btn-block" id="sendCode">Send code</button></div>
        <div id="rStep2" hidden>
          <p id="codeNote" class="offer"></p>
          <label for="rCode">6-digit code</label><input id="rCode" inputmode="numeric" maxlength="6">
          <label for="rNew">New password</label><input id="rNew" type="password">
          <label for="rNew2">Confirm new password</label><input id="rNew2" type="password">
          <button type="button" class="btn btn-block" id="doReset">Reset password</button>
        </div>
        <p class="error-text" id="rErr" role="alert"></p>
      </div>
    </div>
    <p class="auth-or">New to GoalZone?</p>
    <a class="btn btn-outline auth-card-btn" id="toSignup" href="signup.html">Create your GoalZone account</a>
  </main>
  <div id="site-footer"></div>
  <script src="js/products.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/components.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/premium.js"></script>
</body>
</html>
